<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Ular HP</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #header {
            width: 100%;
            max-width: 360px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
        }
        .score-board {
            font-size: 18px;
            font-weight: bold;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        canvas {
            background-color: #2e7d32; /* Background Hijau */
            border: 3px solid #1b5e20;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        /* Tombol Kontrol HP */
        #controls {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(3, 65px);
            grid-template-rows: repeat(2, 55px);
            gap: 10px;
            justify-content: center;
        }
        .btn-ctrl {
            background-color: #333;
            color: white;
            font-size: 20px;
            border: 1px solid #555;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

    <div id="header">
        <div class="score-board">Skor: <span id="score">0</span></div>
        <button id="soundToggle" onclick="toggleSound()">🔊 Suara: ON</button>
    </div>

    <!-- Area Layar Game -->
    <canvas id="gameCanvas" width="320" height="320"></canvas>

    <!-- Tombol Kontrol Layar Sentuh -->
    <div id="controls">
        <button class="btn-ctrl btn-up" onclick="changeDirection('UP')">▲</button>
        <button class="btn-ctrl btn-left" onclick="changeDirection('LEFT')">◄</button>
        <button class="btn-ctrl btn-down" onclick="changeDirection('DOWN')">▼</button>
        <button class="btn-ctrl btn-right" onclick="changeDirection('RIGHT')">►</button>
    </div>

    <div style="margin-top: 15px;">
        <button onclick="startGame()">▶ Play / Restart</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSize = 16;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let food = {};
        let enemy = {};
        let dx = gridSize;
        let dy = 0;
        let score = 0;
        let gameInterval = null;
        let soundEnabled = true;
        let animFrame = 0; // Untuk animasi gelombang ular

        // Sound Effects (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playEatSound() {
            if (!soundEnabled) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById("soundToggle").innerText = soundEnabled ? "🔊 Suara: ON" : "🔇 Suara: OFF";
        }

        function startGame() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            snake = [
                { x: 5 * gridSize, y: 10 * gridSize },
                { x: 4 * gridSize, y: 10 * gridSize }
            ];
            dx = gridSize;
            dy = 0;
            score = 0;
            animFrame = 0;
            document.getElementById("score").innerText = score;

            spawnFood();
            spawnEnemy();

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 150);
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * tileCount) * gridSize,
                y: Math.floor(Math.random() * tileCount) * gridSize
            };
        }

        function spawnEnemy() {
            enemy = {
                x: Math.floor(Math.random() * tileCount) * gridSize,
                y: Math.floor(Math.random() * tileCount) * gridSize
            };
        }

        function changeDirection(dir) {
            if (dir === 'LEFT' && dx === 0) { dx = -gridSize; dy = 0; }
            if (dir === 'UP' && dy === 0) { dx = 0; dy = -gridSize; }
            if (dir === 'RIGHT' && dx === 0) { dx = gridSize; dy = 0; }
            if (dir === 'DOWN' && dy === 0) { dx = 0; dy = gridSize; }
        }

        function gameLoop() {
            animFrame++;
            // Gerakkan Ular
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Menembus tembok (Tempat Luas)
            if (head.x < 0) head.x = canvas.width - gridSize;
            if (head.x >= canvas.width) head.x = 0;
            if (head.y < 0) head.y = canvas.height - gridSize;
            if (head.y >= canvas.height) head.y = 0;

            // Tabrakan dengan tubuh sendiri -> GAME OVER
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            // Tabrakan dengan Musuh (Tantangan)
            if (head.x === enemy.x && head.y === enemy.y) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // Cek jika makan makanan
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById("score").innerText = score;
                playEatSound();
                spawnFood();
                spawnEnemy(); // Pindahkan musuh setiap makan makanan
            } else {
                snake.pop();
            }

            draw();
        }

        // Menggambar Apel
        function drawApple(x, y) {
            const centerX = x + gridSize / 2;
            const centerY = y + gridSize / 2;
            const radius = gridSize / 2 - 2;

            // Buah Apel Merah
            ctx.fillStyle = "#e53935";
            ctx.beginPath();
            ctx.arc(centerX, centerY + 1, radius, 0, Math.PI * 2);
            ctx.fill();

            // Tangkai Apel
            ctx.strokeStyle = "#5d4037";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - radius + 2);
            ctx.lineTo(centerX - 1, centerY - radius - 2);
            ctx.stroke();

            // Daun Hijau
            ctx.fillStyle = "#76ff03";
            ctx.beginPath();
            ctx.arc(centerX + 2, centerY - radius - 1, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function draw() {
            // Bersihkan Layar dengan Latar Belakang Hijau
            ctx.fillStyle = "#2e7d32";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Pola Rumput Sederhana
            ctx.fillStyle = "#338a3e";
            for (let r = 0; r < tileCount; r++) {
                for (let c = 0; c < tileCount; c++) {
                    if ((r + c) % 2 === 0) {
                        ctx.fillRect(c * gridSize, r * gridSize, gridSize, gridSize);
                    }
                }
            }

            // Gambar Makanan (Apel)
            drawApple(food.x, food.y);

            // Gambar Musuh/Rintangan (Kotak Berduri / Burung Perangkap)
            ctx.fillStyle = "#d84315";
            ctx.beginPath();
            ctx.arc(enemy.x + gridSize / 2, enemy.y + gridSize / 2, gridSize / 2 - 1, 0, Math.PI * 2);
            ctx.fill();

            // Gambar Ular dengan Skin dan Animasi
            for (let i = 0; i < snake.length; i++) {
                const seg = snake[i];
                const cx = seg.x + gridSize / 2;
                const cy = seg.y + gridSize / 2;

                // Animasi Goyangan Halus
                const wobble = Math.sin(animFrame + i) * 1.5;

                if (i === 0) {
                    // KEPALA ULAR
                    ctx.fillStyle = "#00e676";
                    ctx.beginPath();
                    ctx.arc(cx, cy, gridSize / 2, 0, Math.PI * 2);
                    ctx.fill();

                    // Mata Ular
                    ctx.fillStyle = "#ffffff";
                    let eyeX1 = cx - 3, eyeY1 = cy - 3;
                    let eyeX2 = cx + 3, eyeY2 = cy - 3;
                    if (dx > 0) { eyeX1 = cx + 2; eyeY1 = cy - 4; eyeX2 = cx + 2; eyeY2 = cy + 4; }
                    else if (dx < 0) { eyeX1 = cx - 2; eyeY1 = cy - 4; eyeX2 = cx - 2; eyeY2 = cy + 4; }
                    else if (dy > 0) { eyeX1 = cx - 4; eyeY1 = cy + 2; eyeX2 = cx + 4; eyeY2 = cy + 2; }
                    else if (dy < 0) { eyeX1 = cx - 4; eyeY1 = cy - 2; eyeX2 = cx + 4; eyeY2 = cy - 2; }

                    ctx.beginPath();
                    ctx.arc(eyeX1, eyeY1, 2.5, 0, Math.PI * 2);
                    ctx.arc(eyeX2, eyeY2, 2.5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "#000000";
                    ctx.beginPath();
                    ctx.arc(eyeX1, eyeY1, 1.2, 0, Math.PI * 2);
                    ctx.arc(eyeX2, eyeY2, 1.2, 0, Math.PI * 2);
                    ctx.fill();

                    // Lidah Ular Merah
                    ctx.strokeStyle = "#ff1744";
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    if (dx > 0) { ctx.moveTo(cx + 8, cy); ctx.lineTo(cx + 12, cy); }
                    else if (dx < 0) { ctx.moveTo(cx - 8, cy); ctx.lineTo(cx - 12, cy); }
                    else if (dy > 0) { ctx.moveTo(cx, cy + 8); ctx.lineTo(cx, cy + 12); }
                    else if (dy < 0) { ctx.moveTo(cx, cy - 8); ctx.lineTo(cx, cy - 12); }
                    ctx.stroke();

                } else {
                    // TUBUH ULAR (Berbentuk membulat dengan animasi)
                    ctx.fillStyle = (i % 2 === 0) ? "#a7ffeb" : "#1de9b6";
                    ctx.beginPath();
                    ctx.arc(cx + (dy !== 0 ? wobble : 0), cy + (dx !== 0 ? wobble : 0), gridSize / 2 - 1, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function gameOver() {
            clearInterval(gameInterval);
            alert("Game Over! Anda menabrak diri sendiri/musuh. Skor: " + score);
        }
    </script>
</body>
</html>
